name: Release

# A v*.*.* tag publishes to npm through trusted publishing (OIDC): no token,
# provenance attached. A version already on npm is not published again (0.1.0
# was published by hand). A manual run only checks the package (dry run).

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.53.1
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task test
      - run: task pack:check
      - name: Check the tag against package.json
        if: github.event_name == 'push'
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi
      - name: Check npm supports trusted publishing
        run: |
          npm --version
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); if (a<11||(a===11&&(b<5||(b===5&&c<1)))) { console.error("npm >= 11.5.1 is required for trusted publishing"); process.exit(1) }' "$(npm --version)"
      - name: Check whether this version is already on npm
        id: registry
        run: |
          version="$(node -p "require('./package.json').version")"
          if output="$(npm view "not-a-drill@${version}" version 2>&1)" && [ -n "${output}" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::not-a-drill@${version} is already on npm: nothing to publish"
          elif [ -z "${output}" ] || echo "${output}" | grep -q E404; then
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            echo "${output}" >&2
            exit 1
          fi
      - name: Publish (dry run)
        if: github.event_name == 'workflow_dispatch'
        # npm refuses an already published version even in a dry run; --force skips only that check.
        run: npm publish --dry-run --force
      - name: Publish
        if: github.event_name == 'push' && steps.registry.outputs.published == 'false'
        run: npm publish
